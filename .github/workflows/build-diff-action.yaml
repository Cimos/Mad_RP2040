name: Build PCB Diff

# Diffs the PR branch against the base. PR-triggered only (the diff is
# meaningless without a base to compare against).
on:
  pull_request:
    branches: [main]
    paths:
      - '**.kicad_pcb'
      - '**.kicad_sch'
      - '**.kicad_pro'
      - '**.kicad_dru'
      - '**.kicad_mod'
      - '**.pretty/**'
      - 'mad_lib/**'
      - 'options.yaml'
      - '.github/workflows/build-diff-action.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate_diff:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name

    steps:
    - name: Checkout (full history for diff)
      uses: actions/checkout@v5
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Get KiCad project name
      run: echo "PROJECT_NAME=$(basename *.kicad_pro .kicad_pro)" >> $GITHUB_ENV

    - name: Clone and Checkout KiBot config
      uses: actions/checkout@v5
      with:
        repository: Cimos/kibot-config
        path: ./kibot-config
        ref: main

    - name: Generate Project Diff
      uses: Cimos/kibot-config@main
      with:
        config: kibot-config/build-diff-kibot.yaml
        dir: output_diff
        schema: '${{ env.PROJECT_NAME }}.kicad_sch'
        board: '${{ env.PROJECT_NAME }}.kicad_pcb'
        logfile: 'logfile_cad/logfile.log'

    - name: Upload Diff logfile
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PROJECT_NAME }}-diff-logfile
        path: logfile_cad

    - name: Upload Diff
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PROJECT_NAME }}-diff
        path: output_diff
