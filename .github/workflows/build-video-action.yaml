name: Generate Video Frames

# Renders animation frames on pushes to main.
# TODO: add a step to assemble the frames into an MP4 (e.g. ffmpeg) and upload it.
on:
  push:
    branches: [main]
    paths:
      - '**.kicad_pcb'
      - '**.kicad_sch'
      - '**.kicad_pro'
      - '**.kicad_mod'
      - '**.pretty/**'
      - 'mad_lib/**'
      - '3dmodels/**'
      - 'options.yaml'
      - '.github/workflows/build-video-action.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate_video:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout (only last commit)
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Get KiCad project name
      run: echo "PROJECT_NAME=$(basename *.kicad_pro .kicad_pro)" >> $GITHUB_ENV

    - name: Clone and Checkout KiBot config
      uses: actions/checkout@v5
      with:
        repository: Cimos/kibot-config
        path: ./kibot-config
        ref: main

    - name: Generate Video Frames
      uses: Cimos/kibot-config@main
      with:
        config: kibot-config/build-video-kibot.yaml
        dir: output_video
        schema: '${{ env.PROJECT_NAME }}.kicad_sch'
        board: '${{ env.PROJECT_NAME }}.kicad_pcb'
        logfile: 'logfile_video/logfile.log'

    - name: Upload Video logfile
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PROJECT_NAME }}-video-logfile
        path: logfile_video

    - name: Upload Video
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PROJECT_NAME }}-video
        path: output_video
